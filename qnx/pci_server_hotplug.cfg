# QNX SDP 8.0 x86_64 development-guest config for software hotplug testing.
# Embed as /proc/boot/pci_server.cfg in a throwaway test IFS and load it at
# initial PCI-server startup, before device clients start. DO_BUS_CONFIG=yes
# can reassign bus resources; do not hot-reconfigure a working production OS.
# Adapt PCI_HW_* for any target other than the supplied Intel x86_64 guest.

[runtime]
PCI_SERVER_MODULE_LIST=/lib/dll/pci/pci_server-event_handler.so

[buscfg]
DO_BUS_CONFIG=yes
PCI_SERVER_BUSCFG_MODULE=/lib/dll/pci/pci_server-buscfg-hotplug.so

[envars]
PCI_HW_MODULE=pci_hw-Intel_x86.so
PCI_HW_CONFIG_FILE=/proc/boot/pci_hw.cfg
